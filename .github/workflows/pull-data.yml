name: Run data pipeline (manual)

# Manual trigger only - click "Run workflow" in the Actions tab.
# Not a cron job, not scheduled - this is the "by hand a few times a year" step,
# just run from GitHub instead of a local terminal.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pull-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r notebooks/requirements.txt jupyter nbconvert nbclient

      - name: Run pipeline notebook
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: jupyter nbconvert --to notebook --execute --inplace notebooks/pull_clean_export.ipynb

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ raw/ notebooks/pull_clean_export.ipynb
          git diff --cached --quiet || git commit -m "Update Community Needs Indexing data (manual pipeline run)"
          git push