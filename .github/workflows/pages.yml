name: Deploy static site to GitHub Pages

# Runs on every push to main. This is a one-shot build/deploy step,
# not a scheduled job - it does not re-run the data pipeline and
# does not run on a cron.
on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload entire repo as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Whole repo root (not just /site) so that relative fetches
          # like ../data/community_needs_index.json resolve the same
          # way they do locally.
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4